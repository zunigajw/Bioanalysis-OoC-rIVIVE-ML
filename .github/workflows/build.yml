# Database Curation on GitHub: the same container and GenDB stages that `just` runs, one job per stage,
# so the run page draws the pipeline flow. The final job attaches the database and spreadsheets.
name: Database Curation
on:
  push:
  workflow_dispatch:

env:
  IMAGE: localhost/database-curation:latest
  RUN: podman run --rm -v ${{ github.workspace }}:/work -w /work localhost/database-curation:latest make -f GenDB

jobs:
  container:
    name: "1. Podman container (justfile + Containerfile)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}"}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: podman build -t $IMAGE -f Containerfile . && podman save -o image.tar $IMAGE

  schema:
    name: "2. Empty database tables (Data_Pipeline.sql)"
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}", fail-on-cache-miss: true}
      - run: podman load -q -i image.tar && $RUN schema
      - uses: actions/upload-artifact@v7
        with: {name: stage-schema, path: output/building.db, retention-days: 1}

  rdkit:
    name: "3. RDKit descriptors + Morgan fingerprints (rdkit_features.py)"
    needs: schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}", fail-on-cache-miss: true}
      - uses: actions/download-artifact@v8
        with: {name: stage-schema, path: output}
      - run: podman load -q -i image.tar && $RUN rdkit
      - uses: actions/upload-artifact@v7
        with: {name: stage-rdkit, path: "output/*.*", retention-days: 1}

  chembl:
    name: "4. ChEMBL targets + human ADME (chembl.py)"
    needs: rdkit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}", fail-on-cache-miss: true}
      - uses: actions/download-artifact@v8
        with: {name: stage-rdkit, path: output}
      - run: podman load -q -i image.tar && $RUN chembl
      - uses: actions/upload-artifact@v7
        with: {name: stage-chembl, path: "output/*.*", retention-days: 1}

  ice:
    name: "5. ICE plasma fraction unbound (ice.py)"
    needs: chembl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}", fail-on-cache-miss: true}
      - uses: actions/download-artifact@v8
        with: {name: stage-chembl, path: output}
      - run: podman load -q -i image.tar && $RUN ice
      - uses: actions/upload-artifact@v7
        with: {name: stage-ice, path: "output/*.*", retention-days: 1}

  database:
    name: "6. Final database + spreadsheets (ooc_drug_ml.db)"
    needs: ice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with: {path: image.tar, key: "container-${{ hashFiles('Containerfile', 'requirements.txt') }}", fail-on-cache-miss: true}
      - uses: actions/download-artifact@v8
        with: {name: stage-ice, path: output}
      - run: podman load -q -i image.tar && $RUN database
      - uses: actions/upload-artifact@v7
        with:
          name: database-and-spreadsheets
          path: |
            output/*.db
            output/*.xlsx
